const tbtn = document.getElementById("tbtn");
const si = document.getElementById("si");
const cb = document.getElementById("cb");
const home = document.getElementById("home");
const cw = document.getElementById("cw");
const sp = document.getElementById("sp");
const sc = document.getElementById("sc");
const stitle = document.getElementById("stitle");
const rinfo = document.getElementById("rinfo");
const ov = document.getElementById("ov");
const mx = document.getElementById("mx");
const mb = document.getElementById("mb");
const mu = document.getElementById("mu");
const mc_el = document.getElementById("mc_el");
const mrn = document.getElementById("mrn");

let theme = "light", timer, currentList = [];

tbtn.addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  document.body.className = theme;
  tbtn.textContent = theme === "dark" ? "☀️" : "🌙";
});

si.addEventListener("input", () => {
  const v = si.value.trim();
  cb.classList.toggle("v", v.length > 0);
  clearTimeout(timer);
  if (!v) { home.style.display = "block"; sp.style.display = "none"; return; }
  if (v.length < 2) return;
  timer = setTimeout(() => doSearch(v), 300);
});

cb.addEventListener("click", () => {
  si.value = ""; cb.classList.remove("v");
  home.style.display = "block"; sp.style.display = "none";
});

mx.addEventListener("click", () => ov.classList.remove("open"));
ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("open"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") ov.classList.remove("open"); });

function card(u, idx) {
  return `<div class="card" onclick="openM(${idx})" tabindex="0" role="button" aria-label="View details for ${u.name}" onkeydown="if(event.key==='Enter')openM(${idx})">
    <div class="ch">
      <div class="rb"><span class="rn">#${u.rank}</span><span class="rl">UK</span></div>
      <div class="ci"><div class="un">${u.name}</div><div class="cn">${u.course}</div></div>
      <span class="cv">&#8250;</span>
    </div>
    <div class="cf">
      <span class="tag">📍 ${u.location}</span>
      <span class="tag tg">⏱ ${u.duration}</span>
      <span class="tag to">💷 ${u.fee}</span>
      ${(u.routeTypes||[]).map(r => `<span class="tag">${r}</span>`).join("")}
    </div>
  </div>`;
}

function openM(idx) {
  const u = currentList[idx];
  const d = u.detail;
  mu.textContent = u.name;
  mc_el.textContent = u.course;
  mrn.textContent = "#" + u.rank;
  const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.mapsQuery || u.name);
  mb.innerHTML = `
    <div class="ds">
      <div class="dst">Course Details</div>
      <div class="dr"><span class="di">📅</span><span class="dl">Open days</span><span class="dv">${d.openDays && d.openDays.length ? '<ul class="odl">' + d.openDays.map(x => '<li>' + x + '</li>').join("") + '</ul>' : "Check university website for upcoming dates"}</span></div>
      <div class="dr"><span class="di">🗓</span><span class="dl">Duration</span><span class="dv">${d.duration}</span></div>
      <div class="dr"><span class="di">📍</span><span class="dl">Location</span><span class="dv"><a class="lk" href="${mapsUrl}" target="_blank" rel="noopener">${d.locationFull} 🗺</a></span></div>
    </div>
    <div class="ds">
      <div class="dst">Entry &amp; Fees</div>
      <div class="dr"><span class="di">🎯</span><span class="dl">UCAS points</span><span class="dv">${d.ucasPoints}</span></div>
      <div class="dr"><span class="di">📝</span><span class="dl">Entry requirements</span><span class="dv">${d.entryRequirements}</span></div>
      <div class="dr"><span class="di">💷</span><span class="dl">Annual fee</span><span class="dv">${d.courseFee}</span></div>
      <div class="dr"><span class="di">🔗</span><span class="dl">Course page</span><span class="dv"><a class="lk" href="${d.courseUrl}" target="_blank" rel="noopener">View course details →</a></span></div>
    </div>
    <div class="ds">
      <div class="dst">Rankings</div>
      <div class="dr"><span class="di">🏛</span><span class="dl">University rank</span><span class="dv"><a class="lk" href="${d.uniRankSource}" target="_blank" rel="noopener">#${u.rank} in UK →</a></span></div>
      <div class="dr"><span class="di">🎓</span><span class="dl">Course rank</span><span class="dv"><a class="lk" href="${d.courseRankSource}" target="_blank" rel="noopener">${d.courseRankPosition}</a></span></div>
    </div>
    <div class="ds">
      <div class="dst">Accommodation</div>
      <div class="dr"><span class="di">🏠</span><span class="dl">Halls / options</span><span class="dv">${d.accommodation}</span></div>
      <div class="dr"><span class="di">🔗</span><span class="dl">Accommodation</span><span class="dv"><a class="lk" href="${d.accommodationUrl}" target="_blank" rel="noopener">View accommodation options →</a></span></div>
    </div>
    <div class="disc">ℹ️ Details are based on current course information and may change. Always verify open day dates, entry requirements, and fees directly with the university before applying.</div>`;
  ov.classList.add("open");
  modal.scrollTop = 0;
}

function doSearch(q) {
  home.style.display = "none"; sp.style.display = "block";
  stitle.textContent = 'Results for "' + q + '"';
  const ql = q.toLowerCase();
  const res = ALL.filter(u =>
    u.name.toLowerCase().includes(ql) ||
    u.course.toLowerCase().includes(ql) ||
    u.location.toLowerCase().includes(ql) ||
    (u.routeTypes||[]).some(r => r.toLowerCase().includes(ql))
  );
  rinfo.textContent = res.length + " course" + (res.length !== 1 ? "s" : "") + " found";
  currentList = res;
  sc.innerHTML = res.length
    ? res.map((u, i) => card(u, i)).join("")
    : '<div class="empty"><div class="ei">🔍</div><p>No courses found for "' + q + '". Try "PGCE", "Leeds" or "Manchester".</p></div>';
}

currentList = UNIS;
cw.innerHTML = UNIS.map((u, i) => card(u, i)).join("");
</script>
</body>
</html>
